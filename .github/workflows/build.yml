name: Build TestDPC APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazel-version: 7.x

      - name: Build APK with Bazel
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Locate and Process APK
        run: |
          # البحث داخل الوصلات الرمزية عن ملف الـ APK النهائي
          APK_PATH=$(find -L . -name "*.apk" | grep -v "unsigned" | head -n 1)
          echo "Found APK at: $APK_PATH"
          
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" ./testdpc_custom.apk
            RAW_SHA256=$(sha256sum ./testdpc_custom.apk | awk '{print $1}')
            URL_SAFE_BASE64=$(echo -n "$RAW_SHA256" | xxd -r -p | base64 | tr '+/' '-_' | tr -d '=')
            echo "=================================================="
            echo "REAL PROVISIONING SIGNATURE CHECKSUM IS:"
            echo "$URL_SAFE_BASE64"
            echo "=================================================="
          else
            echo "ERROR: APK file not found!"
            exit 1
          fi

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release TestDPC Custom v1.0.${{ github.run_number }}
          files: ./testdpc_custom.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
